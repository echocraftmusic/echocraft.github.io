<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Echo Craft Admin Connection Check</title>
<style>
body{margin:0;background:#07111e;color:#f6fbff;font:17px/1.6 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}
main{max-width:620px;margin:24px;padding:28px;border:1px solid #124769;border-radius:18px;background:#0d1a2c}
h1{font-size:26px;line-height:1.3}a{color:#00d9ff}button{font:inherit;font-weight:700;background:#123c34;color:white;border:1px solid #1d765e;border-radius:10px;padding:12px 18px;cursor:pointer}button:disabled{opacity:.5}
#result{padding:16px;background:#071421;border-radius:10px;white-space:pre-wrap}small{color:#9db0c3}
</style>
</head>
<body><main>
<h1>Echo Craft Admin Connection Check</h1>
<p>This checks your approved sign-in and whether the online Admin can read your website's music catalog.</p>
<p><a href="./" target="_blank" rel="noopener">Open Admin to sign in</a>, then return here.</p>
<button id="check" type="button">Check connection</button>
<p id="result" role="status" aria-live="polite">Ready to check.</p>
<small>Album import and publishing are still being connected. This check does not change your website.</small>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const button=document.getElementById('check');
const result=document.getElementById('result');
const client=window.supabase?.createClient(
  'https://jryqukxridujdqfuqinz.supabase.co',
  'sb_publishable_1Uyu1Lfzwolx26MvLEHbQg_NXNHzTLW'
);
button.addEventListener('click',async()=>{
  button.disabled=true;
  result.textContent='Checking your sign-in and GitHub connection…';
  try{
    if(!client)throw new Error('Sign-in tools did not load. Refresh this page.');
    const {data,error}=await client.auth.getSession();
    if(error)throw error;
    if(!data.session)throw new Error('Sign in using the Admin link above, then return here and check again.');
    const response=await fetch('https://echocraft-music-admin.echocraft-aimusic.workers.dev/api/status',{
      headers:{Authorization:'Bearer '+data.session.access_token},
      signal:AbortSignal.timeout(35000)
    });
    const status=await response.json();
    if(!response.ok)throw new Error((status.error||'Connection check failed.')+(status.githubStatus?' GitHub returned '+status.githubStatus+'.':''));
    if(status.ok!==true||status.catalogReadable!==true)throw new Error('The Worker did not return the expected catalog check.');
    result.textContent='Connected successfully.\nYour approved sign-in was verified.\nGitHub catalog read successfully: '+status.itemCount+' releases.\nAlbum import and publishing are the next step.';
  }catch(error){
    result.textContent=error.name==='TypeError'
      ?'Could not reach the Worker. Check your connection and confirm that the Worker was deployed.'
      :error.message||'Connection check failed.';
  }finally{button.disabled=false;}
});
</script></body></html>
