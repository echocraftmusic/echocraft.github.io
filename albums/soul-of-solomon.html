<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soul of Solomon | Echo Craft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        :root{--cyan:#00d9ff;--purple:#8b5cf6;--bg:#070b14;--panel:#101827;--text:#fff;--muted:#aeb8c9}
        html{scroll-behavior:smooth}
        body{
            min-height:100vh;
            font-family:Inter,sans-serif;
            color:var(--text);
            background:
                radial-gradient(circle at 20% 5%,rgba(139,92,246,.18),transparent 35%),
                radial-gradient(circle at 80% 12%,rgba(0,217,255,.14),transparent 32%),
                linear-gradient(160deg,#080d18,#05070d);
        }
        body::before{
            content:"";
            position:fixed;
            inset:0;
            z-index:-1;
            background-image:url("../assets/images/hero-city.webp");
            background-size:cover;
            background-position:center;
            opacity:.18;
            filter:blur(2px);
        }
        a{color:inherit}
        .album-page{
            width:min(1180px,calc(100% - 32px));
            margin:0 auto;
            padding:24px 0 64px;
        }
        .album-topbar{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:16px;
            margin-bottom:24px;
        }
        .back-link,.top-listen{
            display:inline-flex;
            align-items:center;
            gap:9px;
            min-height:44px;
            padding:0 16px;
            border:1px solid rgba(0,217,255,.28);
            border-radius:11px;
            text-decoration:none;
            background:rgba(12,21,37,.72);
            backdrop-filter:blur(12px);
        }
        .album-hero{
            display:grid;
            grid-template-columns:minmax(280px,430px) minmax(0,1fr);
            overflow:hidden;
            border:1px solid rgba(0,217,255,.26);
            border-radius:28px;
            background:linear-gradient(145deg,rgba(20,30,52,.94),rgba(7,12,22,.97));
            box-shadow:0 35px 90px rgba(0,0,0,.48),0 0 50px rgba(0,217,255,.08);
        }
        .album-cover-wrap{position:relative;min-height:100%}
        .album-cover-wrap img{width:100%;height:100%;min-height:430px;object-fit:cover;display:block}
        .album-cover-wrap::after{content:"";position:absolute;inset:0;background:linear-gradient(to right,transparent 65%,rgba(7,12,22,.4))}
        .album-hero-content{padding:clamp(1.5rem,4vw,3.3rem);display:flex;flex-direction:column;justify-content:center}
        .album-label{align-self:flex-start;margin-bottom:1rem;padding:.45rem .85rem;border:1px solid rgba(0,217,255,.34);border-radius:999px;background:rgba(0,217,255,.08);color:#8fefff;font-size:.72rem;font-weight:900;letter-spacing:1.4px;text-transform:uppercase}
        h1{font-family:Orbitron,sans-serif;font-size:clamp(2.2rem,6vw,4.8rem);line-height:1.02;margin-bottom:.7rem;text-shadow:0 0 28px rgba(0,217,255,.17)}
        .album-artist{color:var(--muted);font-size:1.1rem;margin-bottom:1.4rem}
        .album-description{color:rgba(255,255,255,.72);line-height:1.8;margin-bottom:1.8rem}
        .album-links{display:flex;flex-wrap:wrap;gap:10px}
        .album-link{min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:0 16px;border-radius:11px;text-decoration:none;font-weight:800}
        .album-link.primary{background:linear-gradient(135deg,var(--cyan),var(--purple));box-shadow:0 10px 26px rgba(0,217,255,.18)}
        .album-link.secondary{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.05)}
        .player-panel{margin-top:28px;padding:22px;border:1px solid rgba(0,217,255,.20);border-radius:22px;background:rgba(12,20,35,.83);backdrop-filter:blur(16px);box-shadow:0 22px 55px rgba(0,0,0,.36)}
        .now-playing{display:flex;align-items:center;gap:16px;margin-bottom:16px}
        .now-number{width:50px;height:50px;flex:0 0 50px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--cyan);color:#041018;font-family:Orbitron,sans-serif;font-weight:900}
        .now-copy small{display:block;color:#81eaff;font-size:.7rem;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:3px}
        .now-copy strong{font-size:1.05rem}
        #albumAudio{width:100%;height:40px;margin-bottom:16px}
        .transport{display:flex;align-items:center;justify-content:center;gap:13px}
        .transport button{width:52px;height:52px;border:1px solid rgba(0,217,255,.32);border-radius:50%;background:rgba(0,217,255,.08);color:#b7f6ff;font-size:1rem;cursor:pointer}
        .transport .main-play{width:66px;height:66px;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff;font-size:1.2rem;box-shadow:0 0 28px rgba(0,217,255,.24)}
        .tracks-section{margin-top:30px}
        .tracks-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:15px}
        .tracks-heading h2{font-family:Orbitron,sans-serif;font-size:clamp(1.5rem,4vw,2.4rem)}
        .tracks-heading span{color:var(--muted)}
        .track-list{display:flex;flex-direction:column;gap:10px}
        .track-row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:12px;padding:13px 14px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(15,24,41,.78);cursor:pointer;transition:.25s}
        .track-row:hover,.track-row.active{border-color:rgba(0,217,255,.52);background:rgba(0,217,255,.08);transform:translateX(4px)}
        .track-number{color:#7eeaff;font-family:Orbitron,sans-serif;font-size:.82rem;font-weight:800}
        .track-title{font-weight:700}
        .track-play{width:42px;height:42px;border:1px solid rgba(0,217,255,.30);border-radius:50%;background:rgba(0,217,255,.08);color:#aff5ff;cursor:pointer}
        @media(max-width:760px){
            .album-page{
                width:min(100% - 18px,560px);
                padding:10px 0 36px;
            }

            .album-topbar{
                align-items:center;
                margin-bottom:12px;
            }

            .back-link,
            .top-listen{
                min-height:40px;
                padding:0 12px;
                font-size:.86rem;
            }

            .top-listen span{
                display:none;
            }

            .album-hero{
                grid-template-columns:1fr;
                border-radius:20px;
            }

            .album-cover-wrap img{
                min-height:0;
                aspect-ratio:1 / 1;
            }

            .album-hero-content{
                padding:1rem;
            }

            .album-label{
                margin-bottom:.7rem;
                padding:.36rem .7rem;
                font-size:.64rem;
            }

            h1{
                margin-bottom:.35rem;
                font-size:clamp(2rem,11vw,3rem);
                line-height:1.04;
            }

            .album-artist{
                margin-bottom:.85rem;
                font-size:.95rem;
            }

            .album-description{
                margin-bottom:1rem;
                font-size:.88rem;
                line-height:1.58;
            }

            .album-links{
                display:grid;
                grid-template-columns:1fr 1fr;
                gap:8px;
            }

            .album-link{
                min-height:42px;
                padding:0 9px;
                font-size:.78rem;
            }

            .album-link.primary{
                grid-column:1 / -1;
            }

            .player-panel{
                margin-top:16px;
                padding:14px;
                border-radius:18px;
            }

            .now-playing{
                gap:12px;
                margin-bottom:12px;
            }

            .now-number{
                width:44px;
                height:44px;
                flex-basis:44px;
                font-size:.8rem;
            }

            .now-copy strong{
                font-size:.96rem;
            }

            #albumAudio{
                margin-bottom:12px;
            }

            .transport{
                gap:10px;
            }

            .transport button{
                width:46px;
                height:46px;
            }

            .transport .main-play{
                width:58px;
                height:58px;
            }

            .tracks-section{
                margin-top:20px;
            }

            .tracks-heading{
                align-items:center;
                margin-bottom:11px;
            }

            .tracks-heading h2{
                font-size:clamp(1.55rem,8vw,2.1rem);
                line-height:1.08;
            }

            .tracks-heading span{
                font-size:.82rem;
            }

            .track-row{
                grid-template-columns:42px minmax(0,1fr) 40px;
                gap:9px;
                padding:10px;
                border-radius:12px;
            }

            .track-title{
                font-size:.9rem;
            }

            .track-play{
                width:38px;
                height:38px;
            }
        }
    </style>
</head>
<body data-album-title="Soul of Solomon">
    <main class="album-page">
        <div class="album-topbar">
            <a href="../index.html#albums" class="back-link">
                <i class="fas fa-arrow-left"></i>
                Back to Albums
            </a>
            <a href="#" id="topListenEverywhere" class="top-listen" target="_blank" rel="noopener noreferrer">
                <i class="fas fa-headphones"></i>
                <span>Listen Everywhere</span>
            </a>
        </div>

        <section class="album-hero">
            <div class="album-cover-wrap">
                <img id="albumCover" src="../assets/images/ec-icon.webp" alt="Soul of Solomon album cover">
            </div>
            <div class="album-hero-content">
                <div class="album-label" id="albumLabel">Album</div>
                <h1 id="albumTitle">Soul of Solomon</h1>
                <div class="album-artist" id="albumArtist">Echo Craft</div>
                <p class="album-description" id="albumDescription">
                    A complete Echo Craft listening experience inspired by love, devotion, intimacy, and the poetic beauty of the Song of Solomon.
                </p>
                <div class="album-links" id="albumLinks"></div>
            </div>
        </section>

        <section class="player-panel">
            <div class="now-playing">
                <div class="now-number" id="nowNumber">01</div>
                <div class="now-copy">
                    <small>Now Previewing</small>
                    <strong id="nowTitle">Select a track</strong>
                </div>
            </div>

            <audio id="albumAudio" controls preload="metadata" controlsList="nodownload noplaybackrate"></audio>

            <div
                id="audioStatus"
                style="display:none;margin:-4px 0 12px;color:#ffb4c6;font-size:.82rem;line-height:1.45;"
                role="status"
            ></div>

            <div class="transport">
                <button type="button" id="previousTrack" aria-label="Previous track">
                    <i class="fas fa-backward-step"></i>
                </button>
                <button type="button" id="mainPlay" class="main-play" aria-label="Play or pause">
                    <i class="fas fa-play"></i>
                </button>
                <button type="button" id="nextTrack" aria-label="Next track">
                    <i class="fas fa-forward-step"></i>
                </button>
            </div>
        </section>

        <section class="tracks-section">
            <div class="tracks-heading">
                <h2>Track Preview Collection</h2>
                <span id="trackCount">Loading tracks...</span>
            </div>
            <div class="track-list" id="albumTrackList">
                <div class="track-row" aria-live="polite">
                    Loading album tracks...
                </div>
            </div>
        </section>
    </main>

    <script src="../js/album.js"></script>
</body>
</html>
