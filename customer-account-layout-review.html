<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Customer account layout review</title><style>body{margin:0;background:#201c17;color:#fff;font:14px system-ui}header{display:flex;justify-content:center;gap:10px;padding:12px;flex-wrap:wrap}button{background:#51391f;color:white;border:1px solid #c18b36;border-radius:8px;padding:9px 14px;cursor:pointer}button[aria-pressed=true]{background:#a83e00}main{overflow:auto;padding:12px}iframe{display:block;width:390px;height:950px;margin:auto;border:1px solid #c18b36}</style></head><body><header><button data-width="390" aria-pressed="true">Phone</button><button data-width="820" aria-pressed="false">Tablet</button><button data-width="1280" aria-pressed="false">Desktop</button><button id="togglePage">Show checkout</button></header><main><iframe title="Customer account preview" src="my-music.html"></iframe></main><script>const f=document.querySelector('iframe');document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{f.style.width=b.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});document.getElementById('togglePage').onclick=function(){const checkout=this.textContent==='Show checkout';f.src=checkout?'customer-checkout-preview.html':'my-music.html';this.textContent=checkout?'Show My Music':'Show checkout';};</script></body></html>
